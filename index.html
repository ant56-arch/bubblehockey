<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Hockey League</title>
  <link rel="icon" href="images/league-logo.webp">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#0b1f44">
  <meta name="description" content="Standings, schedule, results and records for the Bubble Hockey League.">
  <meta property="og:type" content="website"><meta property="og:title" content="Bubble Hockey League"><meta property="og:description" content="Standings, schedule, results and records for the Bubble Hockey League.">
  <meta property="og:image" content="https://ant56-arch.github.io/bubblehockey/images/league-logo.webp"><meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* First paint: styled like the real page (header bar, background) so nothing unstyled flashes while the real files load. The page body stays hidden until it is ready. */
    html { background: #fff; color: #0a0a0a; } html[data-theme="dark"] { background: #0a0a0b; color: #f4f4f5; }
    body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .site-header { position: sticky; top: 0; z-index: 20; background: #0b1f44; color: #fff; border-bottom: 1px solid #13306b; }
    .site-header .wrap { max-width: 1120px; margin: 0 auto; padding: 10px 24px 6px; display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 62px; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 700; font-size: 1rem; letter-spacing: -0.02em; }
    .brand-logo { width: 46px; height: 46px; border-radius: 6px; flex: none; }
    html:not(.ready) #app, html:not(.ready) footer, html:not(.ready) nav, html:not(.ready) .icon-btn { visibility: hidden; }
  </style>
  <noscript><style>html:not(.ready) #app, html:not(.ready) footer { visibility: visible; }</style></noscript>
  <script>try { var t = localStorage.getItem('bhl_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="#/home"><img class="brand-logo" data-logo src="images/league-logo.webp" alt=""><span id="league-name">Bubble Hockey League</span></a>
      <nav id="nav" aria-label="Main"></nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <button class="icon-btn menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </header>
  <main class="wrap" id="app"><p class="muted">Loading…</p><noscript><p>This site needs JavaScript turned on to show the league data.</p></noscript></main>
  <footer class="wrap muted"><img class="foot-logo" data-logo src="images/league-logo.webp" alt=""><div>Bubble Hockey League · Play fair, shoot straight. · <a class="tiny" href="#/resources">Resources</a></div></footer>

  <script>
    /* Always load the newest code: version.txt is fetched fresh on every visit and added to the file names, so a phone that kept an old copy of this page still picks up new scripts and styles. */
    (async () => {
      const ready = () => document.documentElement.classList.add('ready');
      setTimeout(ready, 8000);            // never leave the page hidden, whatever goes wrong
      let v = String(Date.now());
      try { const r = await fetch('version.txt', { cache: 'no-store' }); if (r.ok) v = (await r.text()).trim() || v; } catch (e) {}
      const fail = f => { document.getElementById('app').innerHTML = '<p>Could not load ' + f + '. Check your connection and reload the page.</p>'; ready(); };
      // everything downloads at the same time; the scripts still run in this order
      const load = (el, f) => new Promise((ok, bad) => { el.onload = ok; el.onerror = () => bad(f); });
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'css/styles.css?v=' + v; const cssDone = load(css, 'styles.css'); document.head.appendChild(css);
      const names = ['app', 'bracket', 'schedule', 'recap', 'members', 'resources', 'faceoff', 'slapshot', 'boss', 'add'];
      const done = names.map(name => { const s = document.createElement('script'); s.async = false; s.src = 'js/' + name + '.js?v=' + v; const p = load(s, name + '.js'); document.body.appendChild(s); return p; });
      try { await Promise.all([cssDone, ...done]); } catch (f) { return fail(f); }
      await startApp(); ready();
    })();
  </script>
</body>
</html>
