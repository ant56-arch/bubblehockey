<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Hockey League</title>
  <link rel="icon" href="images/league-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script>try { var t = localStorage.getItem('bhl_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="#/home"><img class="brand-logo" src="images/league-logo.webp" alt=""><span id="league-name">Bubble Hockey League</span></a>
      <nav id="nav" aria-label="Main"></nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <button class="icon-btn menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </header>
  <main class="wrap" id="app"><p class="muted">Loading…</p><noscript><p>This site needs JavaScript turned on to show the league data.</p></noscript></main>
  <footer class="wrap muted">Bubble Hockey League · Play fair, shoot straight.</footer>

  <script>
    /* Always load the newest code: version.txt is fetched fresh on every visit and added to the file names, so a phone that kept an old copy of this page still picks up new scripts and styles. */
    (async () => {
      let v = String(Date.now());
      try { const r = await fetch('version.txt', { cache: 'no-store' }); if (r.ok) v = (await r.text()).trim() || v; } catch (e) {}
      const fail = f => { document.getElementById('app').innerHTML = '<p>Could not load ' + f + '. Check your connection and reload the page.</p>'; };
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'css/styles.css?v=' + v; document.head.appendChild(css);
      for (const name of ['app', 'schedule', 'members', 'add']) {
        try { await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'js/' + name + '.js?v=' + v; s.onload = ok; s.onerror = bad; document.body.appendChild(s); }); } catch (e) { return fail(name + '.js'); }
      }
      startApp();
    })();
  </script>
</body>
</html>
