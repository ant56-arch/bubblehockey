# Applies a game change (add, edit or delete) that the commissioner submits from the site's Add / Edit tab.
# The tab opens GitHub's "new issue" page with the change filled in; submitting that issue runs this.
# It only reacts to issues opened by the repository owner, and uses GitHub's built-in token (no personal token needed).
name: Apply game change

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: game-changes
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'bhl-game-change')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply the change
        id: apply
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node tools/apply_issue.js

      - name: Commit the change
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "bubble-hockey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json
          git commit -m "$(cat change-message.txt)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report back and close the request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.apply.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment "$ISSUE" --body "Done: $(cat change-message.txt). The site updates in about a minute."
            gh issue close "$ISSUE" --reason completed
          else
            gh issue comment "$ISSUE" --body "Could not apply this change: $(cat change-error.txt 2>/dev/null || echo unknown error). Nothing was changed."
            gh issue close "$ISSUE" --reason "not planned"
          fi
